<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscripción · Torneo Zonas C Atocha</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <main class="card">
    <h1>Inscríbete en el Torneo Zonas C Atocha</h1>
    <p class="sub">Rellena tus datos para reservar tu plaza. Los campos con * son obligatorios.</p>

    <form id="inscripcion" action="#" method="post">

      <fieldset>
        <legend>Datos personales</legend>

        <div class="field">
          <label for="nombre">Nombre completo *</label>
          <input type="text" id="nombre" name="nombre" placeholder="Introduce tu nombre" required>
        </div>

        <div class="field">
          <label for="email">Correo electrónico *</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="field">
          <label for="nacimiento">Fecha de nacimiento</label>
          <input type="date" id="nacimiento" name="nacimiento" max="2010-11-12">
        </div>
      </fieldset>

      <fieldset>
        <legend>Cuenta de jugador</legend>

        <div class="field">
          <label for="nickname">Nombre de jugador (nickname, de 3 a 15 caracteres) *</label>
          <input type="text" id="nickname" name="nickname" minlength="3" maxlength="15" placeholder="Ratzig" required>
        </div>

        <div class="field">
          <label for="password">Contraseña de la cuenta (mínimo 8 caracteres) *</label>
          <input type="password" id="password" name="password" minlength="8" required>
        </div>
      </fieldset>

      <fieldset>
        <legend>Tu torneo</legend>

        <div class="field">
          <label for="juego">Videojuego del torneo</label>
          <select id="juego" name="juego">
            <option value="" selected>Elige un videojuego</option>
            <option value="arf">Arma Reforger</option>
            <option value="swh">Sex with Hitler</option>
            <option value="cs2">Counter-Strike 2</option>
            <option value="sq">Squad</option>
            <option value="aoe2">Age of Empires II</option>
            <option value="rocket-league">Rocket League</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>Plataforma</legend>

        <div class="opcion">
          <input type="radio" id="plat-pc" name="plataforma" value="pc" checked>
          <label for="plat-pc">PC</label>
        </div>
        <div class="opcion">
          <input type="radio" id="plat-ps" name="plataforma" value="ps">
          <label for="plat-ps">PlayStation</label>
        </div>
        <div class="opcion">
          <input type="radio" id="plat-xbox" name="plataforma" value="xbox">
          <label for="plat-xbox">Xbox</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Disponibilidad horaria</legend>

        <div class="opcion">
          <input type="checkbox" id="disp-manana" name="disponibilidad" value="manana">
          <label for="disp-manana">Mañana</label>
        </div>
        <div class="opcion">
          <input type="checkbox" id="disp-tarde" name="disponibilidad" value="tarde">
          <label for="disp-tarde">Tarde</label>
        </div>
        <div class="opcion">
          <input type="checkbox" id="disp-noche" name="disponibilidad" value="noche">
          <label for="disp-noche">Noche</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Para terminar</legend>

        <div class="field">
          <label for="comentarios">Comentarios adicionales a informar</label>
          <textarea id="comentarios" name="comentarios" rows="4" maxlength="500" placeholder="Equipo, necesidades de accesibilidad, dudas…"></textarea>
        </div>

        <div class="opcion">
          <input type="checkbox" id="normas" name="normas" value="aceptadas" required>
          <label for="normas">He leído y acepto las <a href="pages/normas.html" target="_blank">normas del torneo</a>.</label>
        </div>
      </fieldset>

      <button type="submit" class="btn-primary">Inscribirme</button>
      <button type="reset" class="btn-reset">Limpiar formulario</button>
    </form>
  </main>
</body>
</html>
